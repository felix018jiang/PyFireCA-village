schema_version: village-v2-case-1
case_id: v2-two-cell-thermal-ignition
model: effective_exposure_ca_v2
evidence: synthetic_numerical_fixture_not_physical_calibration

grid:
  height: 1
  width: 2
  cell_size_m: 1.0
  x_min_m: 0.0
  y_max_m: 1.0

# These deliberately small synthetic values make the numerical behavior easy to audit.
# They are not recommended values for wood, bamboo, thatch, or any village building.
material_profiles:
  - id: synthetic_fuel
    burnable: true
    parameters:
      fuel_load_kg_m2: 1.0
      moisture_content_dry_basis: 0.0
      heat_of_combustion_J_kg: 1000.0
      ignition_temperature_K: 302.0
      peak_hrrpua_W_m2: 100.0
      radiative_fraction: 1.0
      absorptivity: 1.0
      growth_time_s: 3.0
      decay_time_s: 2.0

construction_profiles:
  - id: synthetic_exposed_surface
    material_id: synthetic_fuel
    ignition_mode: piloted
    parameters:
      effective_heated_dry_mass_kg_m2: 0.01
      specific_heat_J_kg_K: 100.0
      emissivity: 0.0
      ambient_heat_transfer_coefficient_W_m2_K: 0.0
      backing_conductance_W_m2_K: 0.0
      receiver_area_m2: 1.0
      active_surface_area_m2: 1.0
      pyrolysable_dry_mass_fraction: 1.0

cell_construction_grid:
  - [synthetic_exposed_surface, synthetic_exposed_surface]

transport:
  mode: explicit_edges
  calibration: synthetic_unit_transfer_for_numerical_test_only
  edges:
    - source: {row: 0, col: 0}
      target: {row: 0, col: 1}
      weight: 1.0

scenario:
  ambient_temperature_K: 300.0
  max_dt_s: 1.0
  end_time_s: 15.0
  sample_interval_s: 1.0
  ignitions:
    - cell: {row: 0, col: 0}
      time_s: 0.0
      kind: direct
