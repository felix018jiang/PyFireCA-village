[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pyfireca"
version = "0.1.0a0"
description = "A modular and extensible cellular automata framework for wildfire spread simulation."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Jinghao Hu" },
]
keywords = [
  "wildfire",
  "cellular automata",
  "fire spread",
  "GIS",
  "geospatial",
  "Rothermel",
  "scientific computing",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
  "numpy>=1.26",
  "Pillow>=10",
  "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/felix018jiang/PyFireCA-village"
Repository = "https://github.com/felix018jiang/PyFireCA-village"
Issues = "https://github.com/felix018jiang/PyFireCA-village/issues"
Documentation = "https://github.com/felix018jiang/PyFireCA-village/blob/main/docs/HERITAGE_STUDY_CODE.md"
Changelog = "https://github.com/felix018jiang/PyFireCA-village/blob/main/CHANGELOG.md"

[project.scripts]
pyfireca = "pyfireca.cli:main"

[project.optional-dependencies]
gis = [
  "rasterio>=1.3",
]
planning = [
  "shapely>=2",
]
village = [
  "PyProj>=3.6",
  "Shapely>=2",
]
village-vision = [
  "opencv-python-headless>=4.10",
]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff==0.17.6",
  "pre-commit>=3.8",
  "scipy>=1.10",
  "numba>=0.60",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pyfireca"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"

[tool.coverage.run]
source = ["pyfireca"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"src/pyfireca/behavior/fbp.py" = ["SIM114"]
# The published solver signature covers the raw bytes of every src module.
# The Heritage manuscript job checks these files against the frozen archive.
"src/pyfireca/village/building_candidates.py" = ["B007", "E501", "I001"]
"src/pyfireca/village/wind_v3.py" = ["RUF007"]
# Three preparation scripts are SHA-256 inputs to the registered Pingyan experiments.
"scripts/prepare_heritage_pingyan_zero_heat_base_control.py" = ["E501", "I001"]
"scripts/prepare_heritage_pingyan_zero_heat_full_fire.py" = ["E501", "F401", "I001"]
"scripts/prepare_heritage_pingyan_zero_heat_minimum_native.py" = ["E501", "I001"]

[tool.ruff.format]
docstring-code-format = true
exclude = [
  "src/pyfireca/behavior/fbp.py",
  # These exact copies are signed by the manuscript and the Batuan ablation registration.
  "src/pyfireca/village/building_candidates.py",
  "examples/research/heritage/area-20261110/batuan-direct-action-ablation-longcap-20261111.preparer.py",
]
